# ComfyUI 额外模型加载路径 — 基于 t2i_models 目录结构
# 复制到 ComfyUI 根目录 (与 main.py 同级) 后重启生效
#
# 用法:
#   cp extra_model_paths.yaml /path/to/ComfyUI/

t2i_models:
    base_path: /workspace/group_share/adc-sim/users/lik44/models/t2i_models
    diffusion_models: |
      flux/
      sd35/
      qwen/diffusion_models/
    style_models: flux/
    controlnet: |
      flux/controlnet/
      sd35/controlnet/
    text_encoders: |
      text_encoders/
      qwen/text_encoders/
    vae: |
      flux/vae/
      qwen/vae/
    loras: qwen/loras/

# ── Kolors 管线（备选） ──────────────────────────
kolors_models:
    base_path: /workspace/group_share/adc-sim/users/lik44/models/t2i_models/kolors
    diffusion_models: ./
    controlnet: controlnet/
    vae: vae/

# ── SD3.5 管线（备选） ──────────────────────────
sd35_models:
    base_path: /workspace/group_share/adc-sim/users/lik44/models/t2i_models/sd35
    diffusion_models: ./
    controlnet: controlnet/
